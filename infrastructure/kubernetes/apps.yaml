apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-engine
  namespace: stockpred
spec:
  replicas: 1
  selector:
    matchLabels: { app: ml-engine }
  template:
    metadata:
      labels: { app: ml-engine }
    spec:
      containers:
        - name: ml-engine
          image: REGISTRY/stockpred/ml-engine:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: stockpred-config }
            - secretRef: { name: stockpred-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
          volumeMounts:
            - { name: models, mountPath: /service/ml-models }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: '2', memory: 4Gi }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: ml-models }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: ml-models, namespace: stockpred }
spec:
  accessModes: ['ReadWriteOnce']
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: ml-engine, namespace: stockpred }
spec:
  selector: { app: ml-engine }
  ports: [{ port: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: stockpred
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: REGISTRY/stockpred/frontend:latest
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: stockpred }
spec:
  selector: { app: frontend }
  ports: [{ port: 80 }]
