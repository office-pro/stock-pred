# Application workloads. Images are produced by CI (docker-build stage) and
# pushed to your registry - replace REGISTRY/stockpred accordingly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: stockpred
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: REGISTRY/stockpred/api-gateway:latest
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: stockpred-config }
            - secretRef: { name: stockpred-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: stockpred }
spec:
  selector: { app: api-gateway }
  ports: [{ port: 3000 }]
---
