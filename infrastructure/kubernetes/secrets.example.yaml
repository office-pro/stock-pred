# TEMPLATE ONLY - never commit real secrets.
# Create the real secret with:
#   kubectl -n stockpred create secret generic stockpred-secrets \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --from-literal=JWT_ACCESS_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=JWT_REFRESH_SECRET="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: stockpred-secrets
  namespace: stockpred
type: Opaque
stringData:
  DATABASE_URL: 'postgresql://stockpred:CHANGE-ME@postgres:5432/stockpred?schema=public'
  JWT_ACCESS_SECRET: 'CHANGE-ME'
  JWT_REFRESH_SECRET: 'CHANGE-ME'
